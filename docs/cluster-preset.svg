<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="k8s-wizard Produktions-Cluster: aus einem Formular entsteht ein gehärtetes, reproduzierbares kubeadm-Manifest für Kubernetes 1.37">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#326ce5"/>
      <stop offset="1" stop-color="#1f4fb0"/>
    </linearGradient>
    <filter id="sh" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0b1a3a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- self-contained light card, readable on light & dark GitHub themes -->
  <rect x="0" y="0" width="900" height="470" rx="18" fill="#f5f7fb"/>
  <rect x="0.5" y="0.5" width="899" height="469" rx="18" fill="none" stroke="#dbe1ec"/>

  <!-- header -->
  <rect x="28" y="26" width="10" height="30" rx="3" fill="url(#acc)"/>
  <text x="50" y="42" font-size="20" font-weight="700" fill="#111827">k8s-wizard</text>
  <text x="50" y="60" font-size="13" fill="#5b6577">Produktions-Cluster · offline im Browser, kein Serverkontakt</text>
  <text x="872" y="47" text-anchor="end" font-size="13" font-weight="700" fill="#326ce5">Kubernetes 1.37</text>

  <!-- LEFT: wizard form card -->
  <g filter="url(#sh)">
    <rect x="28" y="88" width="300" height="250" rx="14" fill="#ffffff" stroke="#e3e8f0"/>
  </g>
  <text x="48" y="118" font-size="13" font-weight="700" fill="#111827">Formular</text>
  <text x="48" y="135" font-size="11" fill="#8a93a5">Schritte · Erklärungen · Prüfungen</text>

  <!-- form field rows -->
  <g font-size="12" fill="#374151">
    <rect x="48" y="150" width="260" height="30" rx="7" fill="#f2f5fa" stroke="#e3e8f0"/>
    <text x="60" y="169">Version</text><text x="296" y="169" text-anchor="end" font-weight="600" fill="#111827">v1.37.0</text>

    <rect x="48" y="186" width="260" height="30" rx="7" fill="#f2f5fa" stroke="#e3e8f0"/>
    <text x="60" y="205">Pod Security</text><text x="296" y="205" text-anchor="end" font-weight="600" fill="#111827">restricted</text>

    <rect x="48" y="222" width="260" height="30" rx="7" fill="#f2f5fa" stroke="#e3e8f0"/>
    <text x="60" y="241">Secrets verschlüsseln</text>
    <g transform="translate(276,229)"><rect width="34" height="18" rx="9" fill="#326ce5"/><circle cx="25" cy="9" r="7" fill="#fff"/></g>

    <rect x="48" y="258" width="260" height="30" rx="7" fill="#f2f5fa" stroke="#e3e8f0"/>
    <text x="60" y="277">Audit-Logging</text>
    <g transform="translate(276,265)"><rect width="34" height="18" rx="9" fill="#326ce5"/><circle cx="25" cy="9" r="7" fill="#fff"/></g>

    <rect x="48" y="294" width="260" height="30" rx="7" fill="#f2f5fa" stroke="#e3e8f0"/>
    <text x="60" y="313">Kubelet härten</text>
    <g transform="translate(276,301)"><rect width="34" height="18" rx="9" fill="#326ce5"/><circle cx="25" cy="9" r="7" fill="#fff"/></g>
  </g>

  <!-- arrow -->
  <g>
    <text x="364" y="200" text-anchor="middle" font-size="11" fill="#8a93a5">erzeugt</text>
    <path d="M344 214 H388" stroke="#326ce5" stroke-width="2.5" fill="none"/>
    <path d="M384 208 L392 214 L384 220 Z" fill="#326ce5"/>
  </g>

  <!-- RIGHT: manifest output card -->
  <g filter="url(#sh)">
    <rect x="408" y="88" width="464" height="250" rx="14" fill="#0f1729"/>
  </g>
  <circle cx="428" cy="110" r="4.5" fill="#ff5f57"/><circle cx="444" cy="110" r="4.5" fill="#febc2e"/><circle cx="460" cy="110" r="4.5" fill="#28c840"/>
  <text x="852" y="114" text-anchor="end" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#8b98b5">kubeadm-config.yaml</text>

  <!-- generated document chips -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5">
    <g fill="#cdd6e8">
      <rect x="428" y="132" width="424" height="26" rx="6" fill="#182338"/>
      <text x="440" y="149" fill="#7cc7ff">InitConfiguration</text><text x="842" y="149" text-anchor="end" fill="#5f6d8a">v1beta4</text>
      <rect x="428" y="164" width="424" height="26" rx="6" fill="#182338"/>
      <text x="440" y="181" fill="#7cc7ff">ClusterConfiguration</text><text x="842" y="181" text-anchor="end" fill="#5f6d8a">v1beta4</text>
      <rect x="428" y="196" width="424" height="26" rx="6" fill="#182338"/>
      <text x="440" y="213" fill="#7cc7ff">KubeletConfiguration</text><text x="842" y="213" text-anchor="end" fill="#5f6d8a">gehärtet</text>
      <rect x="428" y="228" width="206" height="26" rx="6" fill="#182338"/>
      <text x="440" y="245" fill="#7cc7ff">KubeProxyConfig</text>
      <rect x="646" y="228" width="206" height="26" rx="6" fill="#182338"/>
      <text x="658" y="245" fill="#8affc1">EncryptionConfig</text>
      <rect x="428" y="260" width="206" height="26" rx="6" fill="#182338"/>
      <text x="440" y="277" fill="#8affc1">AdmissionConfig</text>
      <rect x="646" y="260" width="206" height="26" rx="6" fill="#182338"/>
      <text x="658" y="277" fill="#8affc1">Audit Policy</text>
    </g>
    <text x="440" y="308" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#8b98b5"># jede Datei mit Kommentar, wohin sie gehört — reproduzierbar aus einer Datei</text>
  </g>

  <!-- bottom: hardening badges -->
  <g font-size="12" font-weight="600">
    <g transform="translate(28,362)">
      <rect width="150" height="30" rx="15" fill="#eaf1ff" stroke="#c9dbff"/>
      <circle cx="19" cy="15" r="4" fill="#326ce5"/><text x="32" y="19" fill="#1f4fb0">anonymous-auth aus</text>
    </g>
    <g transform="translate(188,362)">
      <rect width="132" height="30" rx="15" fill="#eaf1ff" stroke="#c9dbff"/>
      <circle cx="19" cy="15" r="4" fill="#326ce5"/><text x="32" y="19" fill="#1f4fb0">Profiling aus</text>
    </g>
    <g transform="translate(330,362)">
      <rect width="176" height="30" rx="15" fill="#eaf1ff" stroke="#c9dbff"/>
      <circle cx="19" cy="15" r="4" fill="#326ce5"/><text x="32" y="19" fill="#1f4fb0">TLS ≥ 1.2 · starke Cipher</text>
    </g>
    <g transform="translate(516,362)">
      <rect width="196" height="30" rx="15" fill="#eaf1ff" stroke="#c9dbff"/>
      <circle cx="19" cy="15" r="4" fill="#326ce5"/><text x="32" y="19" fill="#1f4fb0">Secrets at rest verschlüsselt</text>
    </g>
    <g transform="translate(722,362)">
      <rect width="150" height="30" rx="15" fill="#eaf1ff" stroke="#c9dbff"/>
      <circle cx="19" cy="15" r="4" fill="#326ce5"/><text x="32" y="19" fill="#1f4fb0">NodeRestriction</text>
    </g>

    <g transform="translate(28,402)">
      <rect width="150" height="30" rx="15" fill="#eaf1ff" stroke="#c9dbff"/>
      <circle cx="19" cy="15" r="4" fill="#326ce5"/><text x="32" y="19" fill="#1f4fb0">read-only-Port zu</text>
    </g>
    <g transform="translate(188,402)">
      <rect width="176" height="30" rx="15" fill="#eaf1ff" stroke="#c9dbff"/>
      <circle cx="19" cy="15" r="4" fill="#326ce5"/><text x="32" y="19" fill="#1f4fb0">Webhook authn/authz</text>
    </g>
    <g transform="translate(374,402)">
      <rect width="168" height="30" rx="15" fill="#eaf1ff" stroke="#c9dbff"/>
      <circle cx="19" cy="15" r="4" fill="#326ce5"/><text x="32" y="19" fill="#1f4fb0">seccomp RuntimeDefault</text>
    </g>
    <g transform="translate(552,402)">
      <rect width="180" height="30" rx="15" fill="#eaf1ff" stroke="#c9dbff"/>
      <circle cx="19" cy="15" r="4" fill="#326ce5"/><text x="32" y="19" fill="#1f4fb0">Control Plane an localhost</text>
    </g>
    <g transform="translate(742,402)">
      <rect width="130" height="30" rx="15" fill="#eaf1ff" stroke="#c9dbff"/>
      <circle cx="19" cy="15" r="4" fill="#326ce5"/><text x="32" y="19" fill="#1f4fb0">Zert-Rotation</text>
    </g>
  </g>

  <text x="28" y="454" font-size="11" fill="#8a93a5">Alles wird lokal im Browser erzeugt · Speichern/Laden als JSON macht die Konfiguration jederzeit wieder zusammenstellbar</text>
</svg>
